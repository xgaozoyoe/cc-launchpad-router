services:
  inference:
    image: vllm/vllm-openai:v0.10.2
    ports:
      - "127.0.0.1:${PORT:-8002}:8000"
    environment:
      HF_HUB_DISABLE_TELEMETRY: "1"
      VLLM_NO_USAGE_STATS: "1"
    command:
      - --model
      - Qwen/Qwen2.5-VL-3B-Instruct
      - --revision
      - 66285546d2b821cf421d4f5eb2576359d3770cd3
      - --served-model-name
      - qwen2.5-vl-3b-instruct
      - --dtype
      - half
      - --max-model-len
      - "8192"
      - --max-num-seqs
      - "1"
      - --gpu-memory-utilization
      - "0.80"
      - --limit-mm-per-prompt
      - '{"image":1,"video":0}'
      - --mm-processor-kwargs
      - '{"max_pixels":1003520}'
      - --enforce-eager
      - --disable-log-requests
      - --api-key
      - ${INFERENCE_API_KEY:?Run ./run.sh first}
    volumes:
      - ./model-cache:/root/.cache/huggingface
    shm_size: 4gb
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${GPU_DEVICE:-2}"]
              capabilities: [gpu]
