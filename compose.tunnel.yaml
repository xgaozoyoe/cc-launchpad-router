# Create a named tunnel and hostname in Cloudflare before starting this profile.
services:
  tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "run", "--token-file", "/run/secrets/tunnel-token"]
    volumes:
      - ./.secrets/tunnel-token:/run/secrets/tunnel-token:ro
    depends_on:
      inference:
        condition: service_healthy
