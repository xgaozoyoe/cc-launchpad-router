[package]
name = "cc-central"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"

[dependencies]
axum = "=0.8.9"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
mongodb = "=3.3.0"
futures-util = "0.3"
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
